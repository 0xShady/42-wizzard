name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches WIZZARD_VERSION
        run: |
          VERSION=$(grep '^WIZZARD_VERSION=' 42-wizzard.sh | cut -d '"' -f 2)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match WIZZARD_VERSION v$VERSION"
            exit 1
          fi

      - name: Attach the script to the release
        run: gh release upload "$TAG" 42-wizzard.sh --clobber
