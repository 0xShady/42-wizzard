name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Syntax
        run: |
          zsh -n 42-wizzard.sh
          zsh -n assistance/42-wizzard-installer.sh

      - name: Smoke test
        run: zsh tests/smoke.zsh
